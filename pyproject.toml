[project]
name = "finalproject-zagorniakova-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub: virtual fiat and cryptocurrency trading CLI"
readme = "README.md"
authors = [
    { name = "ulnzs", email = "248959128+ulnzs@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = ["prettytable>=3.12,<4", "requests>=2.32,<3"]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"
valutatrade-parser = "valutatrade_hub.parser_service.scheduler:main"

[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10", "pytest-cov>=6,<8"]

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.valutatrade]
DATA_DIR = "data"
LOG_DIR = "logs"
RATES_TTL_SECONDS = 300
BASE_CURRENCY = "USD"
LOG_LEVEL = "INFO"
LOG_MAX_BYTES = 1048576
LOG_BACKUP_COUNT = 3

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
